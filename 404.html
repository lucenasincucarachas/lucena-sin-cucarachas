<!DOCTYPE html>

<html lang="es">
<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<meta
    name="robots"
    content="noindex, nofollow"
>

<title>Página no encontrada | Lucena Sin Cucarachas</title>

<meta
    name="description"
    content="La página que buscas no existe o ha cambiado de ubicación."
>

<link
    rel="icon"
    href="./assets/icons/favicon.ico"
>

<style>

    :root {
        --verde: #165C3A;
        --verde-oscuro: #0E4229;
        --gris-950: #1C211E;
        --gris-600: #626A65;
        --gris-200: #DCE1DE;
        --gris-100: #F3F5F4;
        --blanco: #FFFFFF;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        min-height: 100%;
    }

    body {
        margin: 0;

        display: grid;
        place-items: center;

        min-height: 100vh;
        min-height: 100dvh;

        padding: 1.5rem;

        background: var(--gris-100);
        color: var(--gris-950);

        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        text-align: center;
        -webkit-font-smoothing: antialiased;
    }

    main {
        width: min(100%, 560px);

        padding: 2.5rem 2rem;

        background: var(--blanco);

        border: 1px solid var(--gris-200);
        border-radius: 14px;

        box-shadow:
            0 8px 24px rgba(14, 66, 41, 0.08);
    }

    .numero {
        margin: 0 0 0.5rem;

        color: var(--verde);

        font-size: clamp(4rem, 15vw, 6rem);
        font-weight: 800;
        line-height: 1;

        letter-spacing: -0.06em;
    }

    h1 {
        margin: 0 0 1rem;

        font-size: clamp(1.5rem, 5vw, 2rem);
        line-height: 1.2;
    }

    p {
        margin: 0 auto 1.5rem;

        max-width: 420px;

        color: var(--gris-600);

        line-height: 1.6;
    }

    a {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-height: 46px;

        padding:
            0.75rem
            1.5rem;

        background: var(--verde);
        color: var(--blanco);

        border-radius: 10px;

        font-size: 0.95rem;
        font-weight: 750;

        text-decoration: none;

        transition:
            background-color 150ms ease,
            transform 150ms ease;
    }

    a:hover {
        background: var(--verde-oscuro);
        transform: translateY(-1px);
    }

    a:focus-visible {
        outline: 3px solid rgba(198, 40, 40, 0.28);
        outline-offset: 3px;
    }

    @media (max-width: 480px) {

        main {
            padding:
                2rem
                1.25rem;
        }

    }

    @media (prefers-reduced-motion: reduce) {

        a {
            transition: none;
        }

    }

</style>


</head>

<body>


<main>

    <p
        class="numero"
        aria-hidden="true"
    >
        404
    </p>

    <h1>
        Página no encontrada
    </h1>

    <p>
        La página que buscas no existe,
        ha cambiado de ubicación o ya no está disponible.
    </p>

    <a href="./">
        Volver a Lucena Sin Cucarachas
    </a>

</main>


</body>
</html>
